<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;background:#bfdcf0}
canvas{display:block}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #f2b632;outline-offset:2px}
#hud{position:fixed;top:8px;left:8px;background:rgba(20,38,58,.88);color:#fff;padding:10px 14px;border-radius:12px;font-size:17px;line-height:1.5;max-width:62vw}
#arrow{display:inline-block;font-size:26px;color:#f2b632;vertical-align:middle}

#ov{position:fixed;inset:0;background:rgba(20,38,58,.62);display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#fff;color:#14263a;border-radius:16px;padding:22px 26px;max-width:580px;width:100%;max-height:92vh;overflow:auto;font-size:18px;line-height:1.45}
.card h1{font-size:30px;margin:0 0 .3em;line-height:1.15}
.card h2{font-size:24px;margin:0 0 .4em}
.card p{margin:.5em 0}
.c{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid #14263a;border-radius:10px;background:#fff;color:#14263a;font-size:17px}
.c:hover{background:#fff4d0}
.go{background:#f2b632;color:#14263a;border:0;border-radius:10px;padding:12px 24px;font-size:19px;font-weight:bold;margin-top:10px}
.skip{background:none;border:0;color:#14263a;text-decoration:underline;font-size:15px;margin-left:10px}
blockquote{background:#eef3f8;margin:10px 0;padding:10px 14px;border-radius:8px;border-left:5px solid #f2b632}
input{font:inherit;padding:10px;width:100%;margin:6px 0;border:2px solid #14263a;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:16px;margin:8px 0}td{padding:4px 6px;border-bottom:1px solid #dde}
.ok{color:#1b7a4b;font-weight:bold}.ko{color:#b3261e;font-weight:bold}
#tc{position:fixed;bottom:22px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#tc div{pointer-events:auto;display:flex;gap:10px}
#tc b{width:68px;height:68px;border-radius:50%;background:rgba(20,38,58,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;user-select:none;touch-action:none}
@media(hover:none){#tc{display:flex}}
@media(max-width:600px){#mm{width:120px;height:120px}}

 carree:['La Maison Carrée est un ancien…',['Temple romain','Château fort','Gare ferroviaire'],'C’est un temple romain, l’un des mieux conservés au monde.'],
 magne:['La Tour Magne est un vestige de quoi ?',['De l’enceinte romaine de la ville','D’un phare','D’un château d’eau moderne'],'Elle faisait partie de l’enceinte romaine de Nîmes.'],
 jardins:['Quel monument romain se trouve dans les Jardins de la Fontaine ?',['Le temple de Diane','Le Colisée','Le Panthéon'],'Les ruines du temple de Diane sont dans les Jardins de la Fontaine.'],
 cathedrale:['La cathédrale de Nîmes est dédiée à Notre-Dame et à quel saint ?',['Saint-Castor','Saint-Jacques','Saint-Louis'],'Son nom complet est cathédrale Notre-Dame-et-Saint-Castor.']
};
const bcm=new THREE.MeshBasicMaterial({color:0xf2b632,transparent:true,opacity:.45,side:THREE.DoubleSide,fog:false});
const bc=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,100,16,1,true),bcm);bc.position.y=50;S.add(bc);
const rg=new THREE.Mesh(new THREE.CylinderGeometry(6,6,.2,24),new THREE.MeshBasicMaterial({color:0xf2b632,transparent:true,opacity:.5}));rg.position.y=.2;S.add(rg);
function hud(){
  $('sc').textContent=score;$('fl').textContent=fails;$('tr').textContent=tries[stage]||1;
  $('mis').textContent='Étape '+(stage+1)+'/'+N+' : '+tgt.n;
}
function startLeg(){
  tgt=D.L[stage];tries[stage]=(tries[stage]||0)+1;
  bc.position.x=rg.position.x=tgt.x;bc.position.z=rg.position.z=tgt.z;hud();
}
function toOrigin(){
  P.x=origin.x;P.z=origin.z;P.v=0;P.h=Math.atan2(tgt.x-P.x,-(tgt.z-P.z));
  C.position.set(P.x-Math.sin(P.h)*12,26,P.z+Math.cos(P.h)*12);
}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>{e.style.opacity=0},1400)}

/* ---------- fenêtres et épreuves numériques ---------- */
function openOv(h){$('ov').innerHTML='<div class="card">'+h+'</div>';$('ov').style.display='flex';paused=true;K.up=K.down=K.left=K.right=0}
function closeOv(){$('ov').style.display='none';paused=false}
function fin(ok,msg){
  const first=ok&&tries[stage]===1,pts=first?150:100;
  if(ok){score+=pts;origin={x:P.x,z:P.z};hud()}
  $('fb').innerHTML=(ok?'<span class="ok">✅ Étape réussie ! +'+pts+' points.</span> ':'<span class="ko">❌ Course ratée : il faut refaire cette étape.</span> ')+msg+
   '<br><button class="go" onclick="'+(ok?'nextStage()':'retry()')+'">'+(ok?'Étape suivante ▶':'Recommencer la course ↩')+'</button>';
}
function nextStage(){
  stage++;if(stage>=N){finish();return}
  closeOv();tgt=D.L[stage];P.h=Math.atan2(tgt.x-P.x,-(tgt.z-P.z));startLeg();
}
function retry(){fails++;closeOv();startLeg();toOrigin()}
function finish(){
  const rows=D.L.map((l,i)=>'<tr><td>'+(i+1)+'. '+l.n+'</td><td>'+tries[i]+' essai'+(tries[i]>1?'s':'')+'</td></tr>').join('');
  openOv('<h1>🏆 Bravo !</h1><p>Tu as réussi les '+N+' étapes ! Score : <b>'+score+'</b> points, '+fails+' course(s) ratée(s).</p><table>'+rows+'</table><button class="go" onclick="location.reload()">Rejouer</button>');
}
function quiz(t,intro,opts,expl){
  const a=opts.map((o,i)=>[o,i]).sort(()=>Math.random()-.5);
  Q={g:a.findIndex(x=>x[1]===0),e:expl,d:0};
  openOv('<h2>'+t+'</h2><p>'+intro+'</p>'+a.map((x,i)=>'<button class="c" onclick="pick('+i+')">'+x[0]+'</button>').join('')+'<p id="fb"></p>');
}
function pick(i){if(Q.d)return;Q.d=1;fin(i===Q.g,Q.e)}
function copyCh(){
  openOv('<h2>📋 Copier-coller</h2><p>Le client t’a écrit. Sélectionne son <b>adresse</b> avec la souris, copie-la (<b>Ctrl+C</b>) puis colle-la (<b>Ctrl+V</b>) dans la case.</p>'+
  '<blockquote>Bonjour, merci de livrer ma brandade au <b>12 rue de l’Aspic</b>, au 2e étage. Vous pouvez sonner deux fois. Cordialement, M. Martin</blockquote>'+
  '<input id="t" placeholder="Colle l’adresse ici" autocomplete="off"><button class="go" onclick="chk()">Valider</button><button class="skip" onclick="fin(false,\'Pas de souci, on réessaie !\')">Abandonner</button><p id="fb"></p>');
}
function chk(){
  const v=$('t').value.toLowerCase().replace(/’/g,"'").replace(/[.,\s]+$/,'').trim();
  if(v==="12 rue de l'aspic")fin(true,'Astuce : un double-clic sélectionne un mot, un triple-clic sélectionne toute la ligne.');
  else $('fb').textContent='Pas tout à fait… sélectionne exactement l’adresse (numéro et nom de la rue), puis colle-la.';
}
function phish(){
  const sc=rnd([
   [['<b>De :</b> securite@caf-verif.top<br><b>Objet :</b> URGENT ! Compte bloqué sous 24 h, cliquez ici et donnez votre RIB','<b>De :</b> livraison@centre-multimedia.fr<br><b>Objet :</b> Votre commande de brandade est prête','<b>De :</b> mairie@ville-nimes.fr<br><b>Objet :</b> Horaires d’été du marché'],'Indices : adresse d’expéditeur étrange (« .top »), message urgent et menaçant, demande de données bancaires. Un organisme sérieux ne demande jamais ça par mail.'],
   [['<b>De :</b> colis-express@livr4ison-suivi.com<br><b>Objet :</b> Colis bloqué : payez 1,99 € pour le débloquer','<b>De :</b> atelier@centre-multimedia.fr<br><b>Objet :</b> Rappel : atelier mardi à 14 h','<b>De :</b> Marie (ma sœur)<br><b>Objet :</b> Photos du week-end'],'Indices : fausse adresse de suivi de colis, petit paiement à effectuer pour « débloquer ». C’est une arnaque très courante.']
  ]);
  quiz('🎣 Repère l’arnaque','Parmi ces trois mails, lequel est un <b>faux</b> ? Clique dessus.',sc[0],sc[1]);
}
function pwd(){
  quiz('🔑 Le bon mot de passe','Le code de la porte doit être solide. Lequel choisis-tu ?',['Brandade-Taureau-Olive-92!','azerty123','Nimes2024'],'Un bon mot de passe est <b>long</b> (une phrase ou plusieurs mots) et mélange lettres, chiffres et symboles. « azerty123 » et les dates se devinent en quelques secondes.');
}
function wifi(){
  quiz('📶 Wi-Fi gratuit','Dans un café, tu vois un Wi-Fi gratuit, sans mot de passe. Tu dois consulter ton compte bancaire. Que fais-tu ?',['Je n’utilise pas ce Wi-Fi pour ma banque (j’utilise mes données mobiles)','Je me connecte, c’est pratique','Je demande au serveur de saisir mon mot de passe'],'Un Wi-Fi public n’est pas sécurisé : d’autres personnes peuvent espionner ce que tu envoies. Évite la banque et les mots de passe, ou utilise tes données mobiles.');
}
function call(){
  quiz('📞 Appel suspect','Un « conseiller de ta banque » t’appelle : il dit qu’il faut annuler un virement frauduleux et te demande le code reçu par SMS. Que fais-tu ?',['Je raccroche et je rappelle ma banque avec le numéro officiel','Je donne le code, il veut m’aider','Je donne seulement les 3 premiers chiffres'],'Ne donne jamais un code reçu par SMS : c’est la clé de ton compte. Une vraie banque ne le demande jamais. Raccroche et rappelle toi-même le numéro officiel.');
}
function clickCh(){
  let n=0;
  openOv('<h2>🖱️ Réflexe souris</h2><p>Clique sur la cible <b>5 fois</b>. Elle change de place à chaque clic !</p><div id="zn" style="position:relative;height:220px;background:#eef3f8;border-radius:10px"><button id="tg" style="position:absolute;width:56px;height:56px;border-radius:50%;border:4px solid #14263a;background:#f2b632;font-size:26px">🎯</button></div><p id="fb"></p>');
  const mv=()=>{const z=$('zn'),b=$('tg');b.style.left=Math.random()*(z.clientWidth-60)+'px';b.style.top=Math.random()*(z.clientHeight-60)+'px'};
  mv();
  $('tg').onclick=()=>{n++;if(n>=5)fin(true,'Bien joué, tu maîtrises le clic !');else{mv();$('fb').textContent=n+' / 5'}};
}
function search(){const q=QS[tgt.k];quiz('🔎 Mini-enquête',q[0]+'<br><small>Tu ne sais pas ? Cherche sur le web dans un autre onglet !</small>',q[1],q[2])}
const CH={copy:copyCh,phish,pwd,search,click:clickCh,wifi,call};
function arrive(){CH[tgt.t]()}

/* ---------- réglages ---------- */
$('b1').onclick=e=>{camHigh=!camHigh;e.target.textContent='📷 Caméra : '+(camHigh?'haute':'basse');e.target.blur()};
$('b2').onclick=e=>{for(let i=0;i<10&&peds.length<60;i++)addPed();e.target.blur()};
$('b3').onclick=e=>{for(let i=0;i<5&&cars.length<40;i++)addCar();e.target.blur()};
$('b4').onclick=e=>{lite=!lite;sun.castShadow=shad&&!lite;R.setPixelRatio(lite?.6:Math.min(devicePixelRatio||1,1.5));R.setSize(innerWidth,innerHeight);e.target.textContent='🐢 Mode léger : '+(lite?'oui':'non');e.target.blur()};
$('b5').onclick=e=>{shad=!shad;sun.castShadow=shad&&!lite;e.target.textContent='🌗 Ombres : '+(shad?'oui':'non');e.target.blur()};
onresize=()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()};

/* ---------- boucle ---------- */
function update(dt){
  const a=K.up-K.down;
  P.v+=a*26*dt;P.v-=P.v*(a?1.1:2.6)*dt;P.v=Math.max(-6,Math.min(18,P.v));
  P.h+=(K.right-K.left)*2*dt*Math.max(-1,Math.min(1,P.v/5));
  const fx=Math.sin(P.h),fz=-Math.cos(P.h);
  P.x+=fx*P.v*dt;P.z+=fz*P.v*dt;
  collide();
  P.x=Math.max(E[0]+5,Math.min(E[1]-5,P.x));P.z=Math.max(E[2]+5,Math.min(E[3]-5,P.z));
  pl.position.set(P.x,0,P.z);pl.rotation.y=-P.h;
  sun.position.set(P.x-45,85,P.z+40);sun.target.position.set(P.x,0,P.z);
  const cd=camHigh?12:8,ch=camHigh?26:8;
  CT.set(P.x-fx*cd,ch,P.z-fz*cd);C.position.lerp(CT,1-Math.pow(.002,dt));
  C.lookAt(P.x+fx*5,1,P.z+fz*5);
  for(const p of peds){
    move(p,dt);p.ph+=dt*6;p.j=Math.max(0,p.j-dt);
    p.g.position.set(p.x,Math.abs(Math.sin(p.ph))*.1+(p.j>0?Math.sin(p.j*5)*.6:0),p.z);
    if(p.j<=0&&Math.abs(p.x-P.x)<1.5&&Math.abs(p.z-P.z)<1.5){p.j=.6;P.v*=.7;toast('Pardon ! 🙏')}
  }
  for(const c of cars){
    move(c,dt);c.g.position.set(c.x,0,c.z);c.g.rotation.y=-Math.atan2(c.fx,-c.fz);
    const dx=c.x-P.x,dz=c.z-P.z;
    if(dx*dx+dz*dz<6){P.v=-P.v*.4;P.x-=dx*.2;P.z-=dz*.2;toast('Piiiip ! Attention 🚗')}
  }
  const dx=tgt.x-P.x,dz=tgt.z-P.z,d=Math.hypot(dx,dz);
  $('dist').textContent=d>1000?(d/1000).toFixed(1)+' km':Math.round(d)+' m';
  $('arrow').style.transform='rotate('+(Math.atan2(dx,-dz)-P.h)+'rad)';
  bcm.opacity=.35+.15*Math.sin(performance.now()/250);rg.rotation.y+=dt;
  drawMM();
  if(d<6)arrive();
}
function frame(t){
  requestAnimationFrame(frame);
  const dt=last?Math.min((t-last)/1000,.05):.016;last=t;
  if(!paused)update(dt);
  R.render(S,C);
}

startLeg();toOrigin();
openOv('<h1>Grand Brandade Auto<br>Objectif Écusson</h1><p>Tu pars du Centre Multimédia du CCAS (rue des Chassaintes) et tu livres de la brandade dans le vrai centre de Nîmes : <b>'+N+' étapes</b> à enchaîner, des Arènes aux Jardins de la Fontaine.</p>'+
 '<p><b>Conduire :</b> flèches du clavier ou Z Q S D (ou les boutons à l’écran).<br><b>Se repérer :</b> flèche jaune, colonne de lumière et mini-carte.<br><b>Règle du jeu :</b> à chaque étape, une épreuve t’attend. Si tu la rates, tu refais seulement la course de cette étape. Tu ne passes à la suivante qu’en réussissant. Le compteur d’essais est affiché en haut.</p><button class="go" onclick="closeOv()">Jouer ▶</button>');
requestAnimationFrame(frame);
</script>
